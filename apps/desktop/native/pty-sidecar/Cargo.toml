[package]
name = "lobe-pty-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT AND Apache-2.0"
publish = false

[dependencies]
portable-pty = "=0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
panic = "abort"
strip = true
